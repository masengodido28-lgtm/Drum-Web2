<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DrumWeb | Learn. Practice. Become.</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <!-- ==========================
        NAVBAR
=========================== -->

<header class="navbar">

    <div class="logo">
        <a href="#">
            <img src="./Assets/drumweb logo.png" alt="DrumWeb Logo">
        </a>
    </div>

    <nav class="nav-links">

        <a href="#">
            <i class="bi bi-house-door-fill"></i>
            Home
        </a>

        <a href="#">
            <i class="bi bi-play-circle-fill"></i>
            Lessons
        </a>

        <a href="#">
            <i class="bi bi-music-note-list"></i>
            Rudiments
        </a>

        <a href="#">
            <i class="bi bi-bag-fill"></i>
            Shop
        </a>

    </nav>

    <div class="nav-buttons">

        <button class="btn-login">
            Login
        </button>

        <button class="btn-primary">
            Start Learning
        </button>

    </div>

    <!-- ==========================
          HERO
=========================== -->

<section class="hero">

    <div class="hero-content">

        <!-- Left Side -->

        <div class="hero-text">

            <span class="hero-tag">

                <i class="bi bi-stars"></i>

                #1 Drum Learning Platform

            </span>

            <h1>

                Become the

                <span>Drummer</span>

                You Dream To Be

            </h1>

            <p>

                Master the drums through structured lessons,
                interactive rudiments, real songs,
                and guided practice sessions designed for every level.

            </p>

            <div class="hero-buttons">

                <button class="btn-primary">

                    Start Learning

                </button>

                <button class="btn-secondary">

                    <i class="bi bi-play-circle-fill"></i>

                    Watch Demo

                </button>

            </div>

            <div class="hero-features">

                <span><i class="bi bi-check-circle-fill"></i> 100+ Lessons</span>

                <span><i class="bi bi-check-circle-fill"></i> Interactive Rudiments</span>

                <span><i class="bi bi-check-circle-fill"></i> Beginner Friendly</span>

                <span><i class="bi bi-check-circle-fill"></i> Learn Anywhere</span>

            </div>

        </div>

        <!-- Right Side -->

        <div class="hero-image">

            <img src="./Assets/hero-image.png" alt="Drummer">

        </div>

    </div>

</section>
</header>

</body>

</html>
